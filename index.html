<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿伊植雄 | 10パターンデザインプレビュー</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen flex flex-col items-center pb-12">

  <!-- ==================== デザイン切り替え用コントロールパネル ==================== -->
  <header class="w-full bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="text-center sm:text-left">
        <h1 class="text-sm font-bold tracking-wide">デザインパターン・スイッチャー</h1>
        <p class="text-[11px] text-slate-400">クリックでテーマをリアルタイム切り替え</p>
      </div>
      <!-- セレクトボックス（スマホ・PC共通で押しやすい） -->
      <select id="theme-select" onchange="changeTheme(this.value)" class="bg-slate-800 text-emerald-400 border border-slate-700 text-xs font-bold rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500 w-full sm:w-auto cursor-pointer">
        <option value="p1">1. 「アグリ×テック」ナチュラルモダン</option>
        <option value="p2">2. 「アースカラー」オーガニック</option>
        <option value="p3">3. カード型ダッシュボード</option>
        <option value="p4">4. フォトストーリー＆タイムライン</option>
        <option value="p5">5. ミニマル＆フラットUI</option>
        <option value="p6">6. 地域密着ポップスタイル</option>
        <option value="p7">7. ハイブリッド（ネイビー×グリーン）</option>
        <option value="p8">8. モバイル対話ファースト</option>
        <option value="p9">9. クリーン＆サステナブル</option>
        <option value="p10">10. ストーリーテリング</option>
      </select>
    </div>
  </header>

  <!-- ==================== メイン表示領域（プレビュー枠） ==================== -->
  <main class="w-full max-w-md px-4 mt-8 flex-1">
    
    <!-- カードコンテナ（JSで内部のクラスを差し替えます） -->
    <div id="preview-card" class="transition-all duration-300">
      
      <!-- アイコン・ヘッダー部分 -->
      <div class="text-center mb-6">
        <div id="avatar-container" class="transition-all duration-300">
          <i id="avatar-icon" class="fa-solid fa-user"></i>
        </div>
        <h2 id="user-name" class="transition-all duration-300">阿伊 植雄</h2>
        <p id="user-catch" class="transition-all duration-300">「現場の土」と「最先端のIT」で地域の未来をひらく。</p>
        <p id="user-sub" class="text-xs mt-2 leading-relaxed">元ITエンジニア / 現役新規就農者。<br>アグリテックの普及と行政DXを推進中。</p>
      </div>

      <!-- SNSリンク集 -->
      <div id="link-container" class="space-y-3 mb-6">
        <a href="#" id="link-x" class="link-item">
          <i class="fa-brands fa-x-twitter text-lg"></i>
          <span class="text-xs font-bold flex-1">X (旧Twitter)</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
        </a>
        <a href="#" id="link-line" class="link-item">
          <i class="fa-brands fa-line text-lg"></i>
          <span class="text-xs font-bold flex-1">公式LINEで相談</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
        </a>
        <a href="#" id="link-insta" class="link-item">
          <i class="fa-brands fa-instagram text-lg"></i>
          <span class="text-xs font-bold flex-1">Instagram（活動写真）</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
        </a>
      </div>

      <!-- 政策・メッセージ枠 -->
      <div id="policy-box" class="p-4 rounded-xl text-xs space-y-2">
        <div id="policy-title" class="font-bold border-b pb-1 mb-2">重点政策</div>
        <p>1. スマート農業導入による労働負担軽減</p>
        <p>2. 行政手続きのフルDX（スマホ完結）</p>
      </div>

      <!-- フッター -->
      <div id="card-footer" class="text-center text-[10px] mt-6 opacity-60">
        © 2026 阿伊植雄 後援会
      </div>

    </div>
  </main>

  <!-- ==================== テーマ切替JavaScript ==================== -->
  <script>
    const themes = {
      // 1. アグリ×テック
      p1: {
        bg: "bg-slate-900 text-slate-100 min-h-screen",
        card: "bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl relative overflow-hidden",
        avatar: "w-20 h-20 rounded-2xl bg-emerald-500/10 border-2 border-emerald-500 mx-auto flex items-center justify-center text-emerald-400 text-2xl mb-3",
        avatarIcon: "fa-solid fa-microchip",
        name: "text-xl font-bold text-white",
        catch: "text-xs text-emerald-400 font-mono mt-1",
        linkItem: "flex items-center gap-3 p-3.5 rounded-xl bg-slate-700/50 border border-slate-600 hover:border-emerald-500 transition text-emerald-400",
        policy: "bg-slate-900/50 border border-slate-700 text-slate-300",
        policyTitle: "font-bold border-b border-slate-700 pb-1 mb-2 text-emerald-400"
      },
      // 2. オーガニック
      p2: {
        bg: "bg-[#f7f4ef] text-[#4a403a]",
        card: "bg-[#f0eae1] border border-[#d8cebe] rounded-3xl p-6 shadow-sm",
        avatar: "w-20 h-20 rounded-full bg-[#8a704c] text-white mx-auto flex items-center justify-center text-2xl mb-3",
        avatarIcon: "fa-solid fa-wheat-awn",
        name: "text-xl font-bold text-[#362f2d]",
        catch: "text-xs text-[#8a704c] font-semibold mt-1",
        linkItem: "flex items-center gap-3 p-3.5 rounded-2xl bg-white shadow-sm border border-[#e2d9cc] text-[#4a403a] hover:bg-[#8a704c] hover:text-white transition",
        policy: "bg-white/60 border border-[#e2d9cc] text-[#5c5049]",
        policyTitle: "font-bold border-b border-[#e2d9cc] pb-1 mb-2 text-[#8a704c]"
      },
      // 3. ダッシュボード
      p3: {
        bg: "bg-gray-100 text-gray-800",
        card: "bg-white border border-gray-200 rounded-xl p-6 shadow-md",
        avatar: "w-16 h-16 rounded-lg bg-blue-50 text-blue-600 mx-auto flex items-center justify-center text-2xl mb-3 border border-blue-200",
        avatarIcon: "fa-solid fa-chart-line",
        name: "text-lg font-black text-gray-900",
        catch: "text-xs text-blue-600 font-bold mt-1",
        linkItem: "flex items-center gap-3 p-3 bg-gray-50 border border-gray-200 rounded-lg hover:border-blue-500 text-gray-700 transition",
        policy: "bg-gray-50 border border-gray-200 text-gray-600",
        policyTitle: "font-bold border-b border-gray-200 pb-1 mb-2 text-gray-800"
      },
      // 4. フォトストーリー
      p4: {
        bg: "bg-slate-50 text-slate-800",
        card: "bg-white border border-slate-200 rounded-3xl p-6 shadow-lg",
        avatar: "w-20 h-20 rounded-full bg-emerald-800 text-emerald-100 mx-auto flex items-center justify-center text-2xl mb-3 shadow-md",
        avatarIcon: "fa-solid fa-camera",
        name: "text-xl font-bold text-slate-900",
        catch: "text-xs text-emerald-700 mt-1 font-semibold",
        linkItem: "flex items-center gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200 hover:bg-emerald-50 text-slate-700 transition",
        policy: "bg-emerald-50/50 border border-emerald-100 text-slate-700",
        policyTitle: "font-bold border-b border-emerald-200 pb-1 mb-2 text-emerald-800"
      },
      // 5. ミニマル＆フラット
      p5: {
        bg: "bg-white text-black",
        card: "bg-white border-2 border-black rounded-none p-6 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]",
        avatar: "w-16 h-16 bg-black text-white mx-auto flex items-center justify-center text-2xl mb-3 rounded-none",
        avatarIcon: "fa-solid fa-terminal",
        name: "text-2xl font-black uppercase tracking-tight",
        catch: "text-xs text-gray-500 font-mono mt-1",
        linkItem: "flex items-center gap-3 p-3 border-b-2 border-black hover:bg-black hover:text-white transition font-mono",
        policy: "border-2 border-black p-3 font-mono text-xs",
        policyTitle: "font-bold border-b-2 border-black pb-1 mb-2 uppercase"
      },
      // 6. 地域密着ポップ
      p6: {
        bg: "bg-amber-50/50 text-stone-700",
        card: "bg-white rounded-3xl p-6 shadow-xl shadow-amber-900/5 border-2 border-amber-200",
        avatar: "w-20 h-20 bg-amber-100 rounded-full mx-auto flex items-center justify-center text-amber-600 text-3xl mb-3",
        avatarIcon: "fa-solid fa-face-smile",
        name: "text-xl font-bold text-amber-950",
        catch: "text-xs text-amber-700 font-bold mt-1",
        linkItem: "flex items-center gap-3 p-3.5 bg-amber-100/60 text-amber-950 rounded-full font-bold hover:bg-amber-300 transition",
        policy: "bg-amber-50 rounded-2xl border border-amber-200 text-amber-900",
        policyTitle: "font-bold border-b border-amber-200 pb-1 mb-2 text-amber-800"
      },
      // 7. ハイブリッド（ネイビー×グリーン）
      p7: {
        bg: "bg-slate-100 text-slate-800",
        card: "bg-white rounded-2xl shadow-md border-t-4 border-emerald-600 p-6",
        avatar: "w-20 h-20 rounded-full bg-slate-900 text-emerald-400 mx-auto flex items-center justify-center text-2xl mb-3",
        avatarIcon: "fa-solid fa-building-columns",
        name: "text-xl font-bold text-slate-900",
        catch: "text-xs text-emerald-600 font-bold mt-1",
        linkItem: "flex items-center gap-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 hover:border-emerald-600 transition text-slate-800",
        policy: "bg-slate-50 border border-slate-200 text-slate-700",
        policyTitle: "font-bold border-b border-slate-200 pb-1 mb-2 text-slate-900"
      },
      // 8. モバイル対話
      p8: {
        bg: "bg-gray-50 text-gray-800",
        card: "bg-white rounded-3xl p-6 shadow-xl border border-gray-100",
        avatar: "w-20 h-20 rounded-full bg-emerald-600 text-white mx-auto flex items-center justify-center text-2xl mb-3 shadow-lg shadow-emerald-600/30",
        avatarIcon: "fa-solid fa-comments",
        name: "text-xl font-bold text-gray-900",
        catch: "text-xs text-emerald-600 font-bold mt-1",
        linkItem: "flex items-center gap-3 p-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-md hover:bg-emerald-700 transition",
        policy: "bg-gray-50 border border-gray-200 text-gray-600 rounded-2xl",
        policyTitle: "font-bold border-b border-gray-200 pb-1 mb-2 text-gray-900"
      },
      // 9. クリーン＆サステナブル
      p9: {
        bg: "bg-emerald-50/30 text-emerald-950",
        card: "bg-white/80 backdrop-blur-md p-8 rounded-3xl border border-emerald-100 shadow-xl text-center",
        avatar: "w-20 h-20 rounded-full bg-emerald-100 text-emerald-700 mx-auto flex items-center justify-center text-2xl mb-3",
        avatarIcon: "fa-solid fa-leaf",
        name: "text-2xl font-light text-emerald-950",
        catch: "text-xs text-emerald-600 mt-1 font-medium",
        linkItem: "flex items-center gap-3 p-3.5 rounded-full bg-emerald-50 text-emerald-800 hover:bg-emerald-100 transition font-medium",
        policy: "bg-emerald-50/50 border border-emerald-100 text-emerald-900 rounded-2xl",
        policyTitle: "font-bold border-b border-emerald-200 pb-1 mb-2 text-emerald-800"
      },
      // 10. ストーリーテリング
      p10: {
        bg: "bg-slate-900 text-slate-100",
        card: "bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl",
        avatar: "w-20 h-20 rounded-full bg-slate-700 border border-emerald-400 text-emerald-400 mx-auto flex items-center justify-center text-2xl mb-3",
        avatarIcon: "fa-solid fa-book-open",
        name: "text-xl font-bold text-white",
        catch: "text-xs text-slate-400 mt-1",
        linkItem: "flex items-center gap-3 p-3.5 bg-emerald-500 text-slate-950 rounded-xl font-bold hover:bg-emerald-400 transition",
        policy: "bg-slate-900 border border-slate-700 text-slate-300 rounded-xl",
        policyTitle: "font-bold border-b border-slate-700 pb-1 mb-2 text-emerald-400"
      }
    };

    function changeTheme(themeKey) {
      const t = themes[themeKey];
      
      // 全体背景とカードコンテナ
      document.body.className = t.bg + " min-h-screen flex flex-col items-center pb-12";
      document.getElementById('preview-card').className = t.card;

      // アイコン＆テキスト
      document.getElementById('avatar-container').className = t.avatar;
      document.getElementById('avatar-icon').className = t.avatarIcon;
      document.getElementById('user-name').className = t.name;
      document.getElementById('user-catch').className = t.catch;

      // 各リンクボタン
      const links = document.querySelectorAll('.link-item');
      links.forEach(link => {
        link.className = t.linkItem + " link-item";
      });

      // 政策ボックス
      document.getElementById('policy-box').className = t.policy + " p-4 rounded-xl text-xs space-y-2";
      document.getElementById('policy-title').className = t.policyTitle;
    }

    // 初期読み込み (パターン1)
    changeTheme('p1');
  </script>
</body>
</html>
