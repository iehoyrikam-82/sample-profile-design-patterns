        desc: "理念から実績、SNSリンクまで順を追って伝えるスクロール型構成。",
        html: `

    const btnContainer = document.getElementById('btn-container');
    const previewArea = document.getElementById('preview-area');

    // ボタンの動的生成と切り替え処理
    patterns.forEach((p, index) => {
      const btn = document.createElement('button');
      btn.className = `w-full text-left p-3 rounded-xl transition text-xs flex flex-col ${
        index === 0 ? 'bg-emerald-600 text-white font-bold' : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700'
      }`;
      btn.innerHTML = `
        <span class="font-bold text-sm">${p.title}</span>
        <span class="text-[11px] opacity-80 mt-0.5">${p.desc}</span>
      `;
      btn.onclick = () => selectPattern(index);
      btnContainer.appendChild(btn);
    });

    function selectPattern(index) {
      // ボタンのスタイル更新
      Array.from(btnContainer.children).forEach((btn, idx) => {
        if (idx === index) {
          btn.className = "w-full text-left p-3 rounded-xl transition text-xs flex flex-col bg-emerald-600 text-white font-bold";
        } else {
          btn.className = "w-full text-left p-3 rounded-xl transition text-xs flex flex-col bg-slate-700/50 text-slate-300 hover:bg-slate-700";
        }
      });

      // プレビューの切り替え
      previewArea.innerHTML = patterns[index].html;
    }

    // 初期表示（1番目のパターン）
    selectPattern(0);
